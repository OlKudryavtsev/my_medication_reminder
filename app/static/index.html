<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Семейная аптечка</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{
      --bg:#f6f7fb; --card:#ffffff; --text:#111827; --muted:#6b7280; --line:#e8ecf2;
      --brand:#2f80ed; --brand2:#eaf3ff; --ok:#18a058; --warn:#f59e0b; --danger:#ef4444;
      --soft:#f3f6fb; --shadow:0 8px 28px rgba(15,23,42,.08); --radius:22px;
    }
    [data-theme="dark"]{
      --bg:#0d1117; --card:#161b22; --text:#f2f5f9; --muted:#9aa4b2; --line:#293241;
      --brand:#60a5fa; --brand2:#12233a; --ok:#22c55e; --warn:#fbbf24; --danger:#f87171;
      --soft:#111823; --shadow:0 12px 34px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
    body{padding:env(safe-area-inset-top) 0 calc(82px + env(safe-area-inset-bottom));}
    .wrap{max-width:720px;margin:0 auto;padding:16px 12px 20px}
    .top{position:sticky;top:0;z-index:5;margin:-16px -12px 10px;padding:14px 12px 10px;background:linear-gradient(180deg,var(--bg) 76%,rgba(246,247,251,0));backdrop-filter:blur(16px)}
    [data-theme="dark"] .top{background:linear-gradient(180deg,var(--bg) 76%,rgba(13,17,23,0))}
    .head{display:flex;align-items:center;justify-content:space-between;gap:10px}
    h1{font-size:22px;line-height:1.1;margin:0;font-weight:850;letter-spacing:-.03em}.sub{color:var(--muted);font-size:12px;margin-top:5px}
    .themeBtn{border:1px solid var(--line);background:var(--card);color:var(--text);box-shadow:none;border-radius:999px;width:42px;height:34px;padding:0;font-size:17px;flex:0 0 auto}.profileBar{margin-top:10px;display:grid;grid-template-columns:74px minmax(0,1fr);gap:8px;align-items:center}.profileBar label{margin:0;font-size:10px}.profileBar select{min-height:36px;height:36px;font-size:14px;padding:7px 10px;border-radius:12px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px;margin:10px 0}.card h2{font-size:17px;margin:0 0 10px}.muted{color:var(--muted)}
    .badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--brand2);color:var(--brand);font-size:12px;font-weight:800;margin-bottom:8px}

    .filters{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:4px 0 10px;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:4px}
    .filterBtn{min-height:34px;padding:8px 5px;border-radius:12px;background:transparent;color:var(--muted);font-size:12px;font-weight:850;box-shadow:none;white-space:nowrap}
    .filterBtn.active{background:var(--card);color:var(--brand);box-shadow:0 3px 12px rgba(15,23,42,.08)}

    .dose{display:grid;grid-template-columns:50px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.dose:last-child{border-bottom:0}
    .time{font-weight:850;color:var(--brand);font-size:16px;line-height:1.2;padding-top:2px}.title{min-width:0}.med{font-weight:850;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:var(--muted);line-height:1.25;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:12px;margin-top:4px;color:var(--muted)}
    .pendingActions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px;align-items:stretch}
    .pendingActions button{min-height:34px;height:34px;border-radius:11px;font-size:12px;padding:7px 8px;text-align:center;white-space:nowrap}
    .resultLine{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px;min-height:32px}.doneActions{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:center;margin-top:7px}.doneActions:not(.skipOnly) .resultPill{grid-column:1/-1}.doneActions.skipOnly{grid-template-columns:minmax(0,1fr) auto}.doneActions button{min-width:0}.resultPill{display:flex;align-items:center;gap:5px;min-width:0;border-radius:999px;background:var(--soft);border:1px solid var(--line);padding:7px 10px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.resultPill strong{color:var(--text);font-size:12px;flex:0 0 auto}.resultPill span{min-width:0;overflow:hidden;text-overflow:ellipsis}.editTimeBtn,.changeStatusBtn{min-height:30px!important;height:30px;border-radius:10px!important;font-size:12px!important;background:var(--brand)!important;color:white!important;padding:6px 9px!important;flex:0 0 auto;white-space:nowrap}.changeStatusBtn{background:var(--soft)!important;color:var(--brand)!important;border:1px solid var(--line)!important}
    button{appearance:none;border:0;border-radius:14px;padding:10px 12px;background:var(--brand);color:white;font-weight:850;font-size:14px;line-height:1;min-height:40px}button:disabled{opacity:.42}.ok{background:var(--ok)}.warn{background:var(--warn);color:#111}.danger{background:var(--danger)}.gray{background:var(--brand2);color:var(--brand)}.blue{background:var(--brand)!important;color:white!important}
    input,select{width:100%;min-width:0;border:1px solid var(--line);border-radius:13px;padding:10px;background:var(--card);color:var(--text);font-size:16px;min-height:40px;-webkit-appearance:none;appearance:none}input[type="time"],input[type="date"]{text-align:left}label{display:block;font-size:10px;font-weight:850;color:var(--muted);margin:8px 0 4px;text-transform:uppercase;letter-spacing:.04em}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.wide{width:100%}

    .adminList{display:grid;gap:9px}.formrow{border:1px solid var(--line);border-radius:17px;padding:10px;margin:0;background:rgba(127,127,127,.03);overflow:hidden}
    .fieldLine{display:grid;grid-template-columns:112px minmax(0,1fr);gap:8px;align-items:center;margin:7px 0}.fieldLine label{margin:0;font-size:9px;line-height:1.1;white-space:nowrap}.fieldLine input{width:100%;height:40px}.dateLine{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:7px}.dateLine>*{min-width:0}.dateLine input{width:100%;height:40px}
    .schedTop{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,3fr) minmax(0,2.6fr);gap:7px;align-items:end}.schedComment{margin-top:7px}.schedDates{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px;margin-top:7px}.schedDates>*{min-width:0}.adminActions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.adminActions button{min-height:34px;border-radius:11px;font-size:12px;padding:8px}.formrow input{height:38px;min-height:38px;padding:8px 9px;font-size:14px;border-radius:11px}.formrow label{margin-top:0;font-size:9px;white-space:nowrap}.addForm{display:grid;gap:0}.valueBox{min-width:0;height:38px;display:flex;align-items:center;border:1px solid var(--line);border-radius:11px;background:var(--soft);color:var(--text);padding:8px 9px;font-size:14px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.valueBox.isEmpty{color:var(--muted)}.readonlyHint{font-size:11px;color:var(--muted);margin-top:6px}

    .tableWrap{width:100%;overflow-x:auto}.miniTable{width:100%;min-width:100%;border-collapse:separate;border-spacing:0 7px;table-layout:fixed}.miniTable td,.miniTable th{text-align:left;font-size:13px;padding:9px 8px;vertical-align:middle;background:rgba(127,127,127,.04);overflow-wrap:anywhere}.miniTable th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.03em}.miniTable td:first-child,.miniTable th:first-child{border-radius:12px 0 0 12px}.miniTable td:last-child,.miniTable th:last-child{border-radius:0 12px 12px 0}.statsTable th:nth-child(1),.statsTable td:nth-child(1){width:42%}.statsTable th:not(:first-child),.statsTable td:not(:first-child){text-align:center}.historyTable th:nth-child(1),.historyTable td:nth-child(1){width:30%}.historyTable th:nth-child(2),.historyTable td:nth-child(2){width:36%}.historyTable th:nth-child(3),.historyTable td:nth-child(3){width:34%}

    .bottomTabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:7px max(9px,env(safe-area-inset-left)) calc(7px + env(safe-area-inset-bottom)) max(9px,env(safe-area-inset-right));display:flex;justify-content:center;gap:6px}[data-theme="dark"] .bottomTabs{background:rgba(22,27,34,.88)}
    .tab{max-width:720px;flex:1;border-radius:15px;background:transparent;color:var(--muted);box-shadow:none;padding:7px 3px;min-height:52px;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.tab svg{width:21px;height:21px;display:block;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.tab.active{background:var(--brand2);color:var(--brand)}.hidden{display:none!important}.deny{background:#fff0f0;color:#7f1d1d;border:1px solid #ffd0d0}[data-theme="dark"] .deny{background:#33191b;color:#fecaca;border-color:#7f1d1d}
    .toast{position:fixed;left:12px;right:12px;bottom:calc(82px + env(safe-area-inset-bottom));background:#111827;color:white;border-radius:16px;padding:12px 13px;text-align:center;display:none;z-index:30;font-size:14px}.empty{text-align:center;color:var(--muted);padding:22px 8px}
    .modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.28);display:flex;align-items:flex-end;justify-content:center;padding:16px 12px calc(16px + env(safe-area-inset-bottom))}.modal.hidden{display:none!important}.modalCard{width:min(520px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.22)}.modalCard h3{margin:0 0 12px;font-size:18px}.modalActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.statusChoice{display:grid;gap:8px}.statusOption{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--soft);font-weight:850;cursor:pointer}.statusOption.selected{border-color:var(--brand);background:var(--brand2);color:var(--brand)}.statusDot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;background:var(--card)}.statusOption.selected .statusDot{border-color:var(--brand);background:var(--brand);box-shadow:inset 0 0 0 5px var(--card)}.frequencySlots{display:grid;gap:8px;margin-top:4px}.slotRow{display:grid;grid-template-columns:112px minmax(0,1fr);gap:8px;align-items:center;margin:7px 0}.slotRow label{margin:0;font-size:9px;line-height:1.1;white-space:nowrap}.slotGroup{border:1px solid var(--line);border-radius:15px;padding:9px;background:rgba(127,127,127,.03)}.slotGroupTitle{font-size:11px;font-weight:850;color:var(--muted);margin-bottom:4px}
    @media(max-width:420px){.wrap{padding-left:10px;padding-right:10px}.top{margin-left:-10px;margin-right:-10px;padding-left:10px;padding-right:10px}.grid2,.grid3{grid-template-columns:1fr 1fr}.dose{grid-template-columns:46px minmax(0,1fr);gap:8px}.time{font-size:15px}.med{font-size:14px}.pendingActions{grid-template-columns:1fr 1fr 1fr;gap:5px}.pendingActions button{font-size:11px;padding-left:5px;padding-right:5px}.resultPill{padding:6px 8px}.editTimeBtn,.changeStatusBtn{font-size:11px!important;padding-left:6px!important;padding-right:6px!important}.filters{gap:4px}.filterBtn{font-size:10px;padding-left:1px;padding-right:1px}.card{padding:11px;border-radius:19px}.schedTop{grid-template-columns:minmax(0,4fr) minmax(0,3fr) minmax(0,2.6fr);gap:6px}.schedDates{gap:6px}.fieldLine{grid-template-columns:106px minmax(0,1fr);gap:6px}.formrow{padding:8px}.formrow input{font-size:13px;padding-left:7px;padding-right:7px}.adminActions button{font-size:11px}.miniTable td,.miniTable th{font-size:12px;padding:8px 6px}.tab{font-size:9.5px}.sub{display:none}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top"><div class="head"><div><h1>💊 Семейная аптечка</h1><div class="sub">Лекарства, отметки, история и спокойные родители</div></div><button class="themeBtn" onclick="toggleTheme()" id="themeBtn">🌙</button></div><div id="profileBar" class="profileBar hidden"><label>Профиль</label><select id="profileSelect" onchange="changeProfile()"></select></div></div>
    <div id="access" class="card hidden"></div>
    <main id="main" class="hidden">
      <section id="pageToday" class="page"><div class="card"><span class="badge">Сегодня</span><div class="filters"><button id="filterPending" class="filterBtn active" onclick="setTodayFilter('pending')">Не принято</button><button id="filterSnoozed" class="filterBtn" onclick="setTodayFilter('snoozed')">Отложено</button><button id="filterSkipped" class="filterBtn" onclick="setTodayFilter('skipped')">Пропущено</button><button id="filterTaken" class="filterBtn" onclick="setTodayFilter('taken')">Выпил</button><button id="filterAll" class="filterBtn" onclick="setTodayFilter('all')">Все</button></div><div id="today">Загрузка...</div></div></section>
      <section id="pageStats" class="page hidden"><div class="card"><h2>Статистика за 30 дней</h2><div id="stats">Загрузка...</div></div></section>
      <section id="pageHistory" class="page hidden"><div class="card"><h2>История по препарату</h2><label>Препарат</label><select id="medicineSelect" onchange="loadHistory()"></select><div id="history" class="muted" style="margin-top:10px">Выберите препарат</div></div></section>
      <section id="pageAdmin" class="page hidden">
        <div class="card"><h2>Добавить лекарство</h2>
          <div class="addForm">
            <div class="fieldLine"><label>Лекарство</label><input id="name" placeholder="Аквадетрим" /></div>
            <div class="fieldLine"><label>Доза</label><input id="dose" placeholder="2 капли" /></div>
            <div class="fieldLine"><label>Периодичность</label><select id="frequency" onchange="renderFrequencySlots()">
              <option value="daily:1:1">1 раз в день</option>
              <option value="daily:1:2">2 раза в день</option>
              <option value="daily:1:3">3 раза в день</option>
              <option value="weekly:7:1">1 раз в неделю</option>
              <option value="weekly:14:1">1 раз в 2 недели</option>
              <option value="monthly:30:1">1 раз в месяц</option>
            </select></div>
            <div id="frequencySlots" class="frequencySlots"></div>
            <div class="dateLine"><div><label>Дата начала</label><input id="startDate" type="date" /></div><div><label>Дата окончания</label><input id="endDate" type="date" /></div></div>
            <button class="wide" onclick="addSchedule()" style="margin-top:10px">Добавить лекарство</button>
          </div>
        </div>
        <div class="card"><h2>Текущее расписание</h2><div id="schedules">Загрузка...</div></div>
      </section>
    </main>
  </div>
  <nav id="bottomTabs" class="bottomTabs hidden">
    <button id="tabToday" class="tab active" onclick="showTab('today')"><svg viewBox="0 0 24 24"><path d="M8 3v3M16 3v3M4 9h16"/><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 13h3M8 17h6"/></svg><span>Сегодня</span></button>
    <button id="tabStats" class="tab" onclick="showTab('stats')"><svg viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M4 19h16"/><rect x="7" y="11" width="3" height="5" rx="1"/><rect x="12" y="7" width="3" height="9" rx="1"/><rect x="17" y="13" width="3" height="3" rx="1"/></svg><span>Статистика</span></button>
    <button id="tabHistory" class="tab" onclick="showTab('history')"><svg viewBox="0 0 24 24"><path d="M12 8v5l3 2"/><path d="M4.3 12a7.7 7.7 0 1 0 2.2-5.4"/><path d="M4 4v5h5"/></svg><span>История</span></button>
    <button id="tabAdmin" class="tab hidden" onclick="showTab('admin')"><svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1A2 2 0 1 1 4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1A2 2 0 1 1 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6h.1a1.7 1.7 0 0 0 1.9-.3l.1-.1A2 2 0 1 1 19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.6 1h.1a2 2 0 1 1 0 4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg><span>Админ</span></button>
  </nav>
  <div id="modal" class="modal hidden" onclick="closeModalByBackdrop(event)">
    <div class="modalCard">
      <h3 id="modalTitle">Выбор</h3>
      <div id="modalBody"></div>
      <div class="modalActions"><button class="gray" onclick="closeModal()">Отменить</button><button id="modalOk" onclick="modalSubmit()">Сохранить</button></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
<script>
  const tg = window.Telegram?.WebApp; if (tg) { tg.ready(); tg.expand(); }
  const initData = tg?.initData || ""; let me = null; let todayRows = []; let todayFilter = 'pending'; localStorage.setItem('todayFilter','pending');
  const savedTheme = localStorage.getItem('theme') || (tg?.colorScheme === 'dark' ? 'dark' : 'light');
  setTheme(savedTheme);
  function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('theme',t);document.getElementById('themeBtn').textContent=t==='dark'?'☀️':'🌙'}
  function toggleTheme(){setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')}
  function toast(text){const el=document.getElementById('toast');el.textContent=text;el.style.display='block';setTimeout(()=>el.style.display='none',3000)}
  async function api(path, options={}){const res=await fetch(path,{...options,headers:{'Content-Type':'application/json','X-Telegram-Init-Data':initData,...(options.headers||{})}});if(!res.ok)throw new Error(await res.text());const txt=await res.text();return txt?JSON.parse(txt):{}}
  let modalResolver=null;
  function closeModal(value=null){document.getElementById('modal').classList.add('hidden');if(modalResolver){modalResolver(value);modalResolver=null}}
  function closeModalByBackdrop(e){if(e.target.id==='modal')closeModal(null)}
  function modalSubmit(){if(window.__modalSubmit)window.__modalSubmit();else closeModal(true)}
  function openModal(title, bodyHtml, submitFn){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=bodyHtml;document.getElementById('modal').classList.remove('hidden');window.__modalSubmit=submitFn;return new Promise(resolve=>{modalResolver=resolve})}
  async function chooseTime(title, current){
    const value=(current || new Date().toTimeString().slice(0,5));
    return await openModal(title, `<label>Время</label><input id="modalTime" type="time" value="${escapeHtml(value)}">`, ()=>closeModal(document.getElementById('modalTime').value));
  }
  function selectStatusOption(value){
    document.querySelectorAll('.statusOption').forEach(el=>el.classList.toggle('selected', el.dataset.status===value));
    const hidden=document.getElementById('modalStatus');
    if(hidden) hidden.value=value;
  }
  async function chooseStatus(current){
    const option=(value, label)=>`<button type="button" class="statusOption ${current===value?'selected':''}" data-status="${value}" onclick="selectStatusOption('${value}')"><span class="statusDot"></span><span>${label}</span></button>`;
    return await openModal('Изменить статус', `<input id="modalStatus" type="hidden" value="${escapeHtml(current||'pending')}"><div class="statusChoice">
      ${option('pending','⏳ Не принято')}
      ${option('taken','✅ Принято')}
      ${option('skipped','⏭️ Пропущено')}
    </div>`, ()=>closeModal(document.getElementById('modalStatus').value));
  }

  async function loadProfiles(){
    profiles = await api('/api/profiles');
    if(!profiles.length)return;
    currentProfileId = Number(localStorage.getItem('activeProfileId')) || (profiles.find(p=>p.active)?.id) || profiles[0].id;
    if(!profiles.some(p=>p.id===currentProfileId)) currentProfileId = profiles[0].id;
    const sel=document.getElementById('profileSelect');
    sel.innerHTML=profiles.map(p=>`<option value="${p.id}">${escapeHtml(p.kind==='personal'?'👤 '+p.name:'👶 '+p.name)}</option>`).join('');
    sel.value=String(currentProfileId);
    document.getElementById('profileBar').classList.toggle('hidden', profiles.length<2);
  }
  async function changeProfile(){
    currentProfileId=Number(document.getElementById('profileSelect').value);
    localStorage.setItem('activeProfileId', String(currentProfileId));
    try{ await api('/api/active-profile',{method:'POST',body:JSON.stringify({profile_id:currentProfileId})}); }catch(e){}
    editSchedules.clear();
    await loadToday();
    if(!document.getElementById('pageStats').classList.contains('hidden')) await loadStats();
    if(!document.getElementById('pageHistory').classList.contains('hidden')) await loadMedicines();
    if(!document.getElementById('pageAdmin').classList.contains('hidden')) await loadSchedules();
  }

  function pageId(name){return 'page'+name[0].toUpperCase()+name.slice(1)} function tabId(name){return 'tab'+name[0].toUpperCase()+name.slice(1)}
  function showTab(name){['today','stats','history','admin'].forEach(t=>{document.getElementById(pageId(t))?.classList.add('hidden');document.getElementById(tabId(t))?.classList.remove('active')});document.getElementById(pageId(name)).classList.remove('hidden');document.getElementById(tabId(name)).classList.add('active');location.hash=name==='today'?'':'#'+name;if(name==='today')loadToday();if(name==='stats')loadStats();if(name==='history')loadMedicines();if(name==='admin')loadSchedules();window.scrollTo({top:0,behavior:'smooth'});}
  function setTodayFilter(f){todayFilter=f;localStorage.setItem('todayFilter',f);renderToday()}
  function applyFilter(rows){if(todayFilter==='all')return rows;if(todayFilter==='skipped')return rows.filter(r=>r.status==='skipped');if(todayFilter==='taken')return rows.filter(r=>r.status==='taken');if(todayFilter==='snoozed')return rows.filter(r=>r.status==='pending'&&r.postponed_until);return rows.filter(r=>r.status==='pending')}
  function statusText(r){if(r.status==='taken')return '✅ принято в '+(r.taken_at||'—');if(r.status==='skipped')return '⏭️ пропущено '+(r.skipped_at||'');if(r.postponed_until)return '😴 отложено до '+r.postponed_until;return '⏳ ждет отметки'}
  function escapeHtml(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
  function renderToday(){
    ['pending','snoozed','skipped','taken','all'].forEach(f=>document.getElementById('filter'+f[0].toUpperCase()+f.slice(1))?.classList.toggle('active',todayFilter===f));
    const root=document.getElementById('today');const rows=applyFilter(todayRows);
    if(!rows.length){root.innerHTML='<div class="empty">По этому фильтру приемов нет</div>';return}
    root.innerHTML=rows.map(r=>{
      let controls='';
      let statusLine = '';
      if(r.status==='pending'){
        statusLine = `<div class="status">${statusText(r)}</div>`;
        controls=`<div class="pendingActions"><button class="ok" onclick="take(${r.id})">Выпил</button><button class="warn" onclick="snooze(${r.id})">+30 мин</button><button class="danger" onclick="skip(${r.id})">Пропустил</button></div>`;
      } else if(r.status==='taken'){
        controls=`<div class="doneActions"><div class="resultPill"><strong>✅ Принято</strong><span>факт ${r.taken_at||'—'}</span></div><button class="editTimeBtn" onclick="editTakenTime(${r.id}, '${r.taken_at||''}', '${r.time||''}')">Изменить время</button><button class="changeStatusBtn" onclick="changeStatus(${r.id}, '${r.status}', '${r.taken_at||''}', '${r.time||''}')">Изменить статус</button></div>`;
      } else if(r.status==='skipped'){
        controls=`<div class="doneActions skipOnly"><div class="resultPill"><strong>⏭️ Пропущено</strong><span>${r.skipped_at||''}</span></div><button class="changeStatusBtn" onclick="changeStatus(${r.id}, '${r.status}', '${r.taken_at||''}', '${r.time||''}')">Изменить статус</button></div>`;
      }
      return `<div class="dose"><div class="time">${r.time}</div><div class="title"><div class="med">${escapeHtml(r.medicine)}</div><div class="meta">${escapeHtml(r.dose)} · ${escapeHtml(r.label)}</div>${statusLine}${controls}</div></div>`
    }).join('')
  }
  async function loadToday(){todayRows=await api('/api/today');renderToday()}
  async function take(id){
    const now=new Date().toTimeString().slice(0,5);
    const actual=await chooseTime('Фактическое время приема', now);
    if(actual===null)return;
    if(!/^\d{2}:\d{2}$/.test(actual)){toast('Выберите время');return}
    const data=await api(`/api/events/${id}/take`,{method:'POST',body:JSON.stringify({actual_time:actual})});
    toast(data.message||'Сохранено');
    await loadToday();
    if(tg?.HapticFeedback)tg.HapticFeedback.notificationOccurred('success')
  }
  async function editTakenTime(id,current,planned){const value=await chooseTime('Фактическое время приема', current || planned);if(value===null)return;if(!/^\d{2}:\d{2}$/.test(value)){toast('Выберите время');return}const data=await api(`/api/events/${id}/taken-time`,{method:'PATCH',body:JSON.stringify({actual_time:value})});toast(data.message||'Время обновлено');await loadToday()}

  async function changeStatus(id,current,currentTime,planned){
    const status=await chooseStatus(current);
    if(!status)return;
    let actual_time=null;
    if(status==='taken'){
      actual_time=await chooseTime('Фактическое время приема', currentTime || planned);
      if(actual_time===null)return;
      if(!/^\d{2}:\d{2}$/.test(actual_time)){toast('Выберите время');return}
    }
    const data=await api(`/api/events/${id}/status`,{method:'PATCH',body:JSON.stringify({status, actual_time})});
    toast(data.message||'Статус обновлен');
    await loadToday();
  }

  async function skip(id){await api(`/api/events/${id}/skip`,{method:'POST',body:JSON.stringify({})});toast('Пропуск сохранен');loadToday()}
  async function snooze(id){const data=await api(`/api/events/${id}/snooze`,{method:'POST',body:JSON.stringify({})});toast(data.message||'Отложено');loadToday()}
  const editSchedules = new Set();
  const scheduleDrafts = new Map();
  function fieldHtml(id, value, editable, type='text'){
    const safe = escapeHtml(value || '');
    if(editable) return `<input id="${id}" ${type!=='text'?`type="${type}"`:''} value="${safe}">`;
    return `<div id="${id}" class="valueBox ${safe?'':'isEmpty'}" data-value="${safe}">${safe || '—'}</div>`;
  }
  function scheduleForm(r){
    const edit=editSchedules.has(r.id);
    return `<div class="formrow" id="sched_${r.id}">
      <div class="schedTop">
        <div><label>Лекарство</label>${fieldHtml('s_name_'+r.id, r.name, edit)}</div>
        <div><label>Доза</label>${fieldHtml('s_dose_'+r.id, r.dose, edit)}</div>
        <div><label>Время</label>${fieldHtml('s_time_'+r.id, r.time_local, edit, 'time')}</div>
      </div>
      <div class="schedComment"><label>Комментарий</label>${fieldHtml('s_label_'+r.id, r.label, edit)}</div>
      <div class="schedDates"><div><label>Дата начала</label>${fieldHtml('s_start_'+r.id, r.start_date || '', edit, 'date')}</div><div><label>Дата окончания</label>${fieldHtml('s_end_'+r.id, r.end_date || '', edit, 'date')}</div></div>
      <div class="adminActions">${edit?`<button onclick="saveSchedule(${r.id})">Сохранить</button><button class="gray" onclick="cancelScheduleEdit(${r.id})">Отменить</button>`:`<button class="blue" onclick="enableScheduleEdit(${r.id})">Изменить</button><button class="danger" onclick="deleteSchedule(${r.id})">Удалить</button>`}</div>
    </div>`
  }
  function enableScheduleEdit(id){editSchedules.add(id);loadSchedules()}
  function cancelScheduleEdit(id){editSchedules.delete(id);scheduleDrafts.delete(id);loadSchedules()}
  async function loadSchedules(){if(!me?.can_manage_current_profile)return;const rows=await api('/api/schedules');const root=document.getElementById('schedules');root.innerHTML=rows.length?`<div class="adminList">${rows.map(scheduleForm).join('')}</div>`:'<div class="empty">Расписание пустое</div>'}
  function readSchedule(id){return {name:document.getElementById('s_name_'+id).value.trim(),dose:document.getElementById('s_dose_'+id).value.trim(),time_local:document.getElementById('s_time_'+id).value,label:document.getElementById('s_label_'+id).value.trim(),start_date:document.getElementById('s_start_'+id).value||null,end_date:document.getElementById('s_end_'+id).value||null}}
  async function saveSchedule(id){const p=readSchedule(id);if(!p.name||!p.dose||!p.time_local){toast('Заполните лекарство, дозу и время');return}await api('/api/schedules/'+id,{method:'PUT',body:JSON.stringify(p)});editSchedules.delete(id);scheduleDrafts.delete(id);toast('Расписание обновлено');loadSchedules();loadToday()}
  function parseFrequency(){const [type,interval,count]=document.getElementById('frequency').value.split(':');return {recurrence_type:type, recurrence_interval_days:Number(interval), count:Number(count)}}
  function renderFrequencySlots(){const {count}=parseFrequency();const root=document.getElementById('frequencySlots');let defaults=['09:00','15:00','21:00'];root.innerHTML=Array.from({length:count},(_,i)=>`<div class="slotGroup"><div class="slotGroupTitle">Прием ${i+1}</div><div class="slotRow"><label>Время</label><input id="slotTime${i}" type="time" value="${defaults[i]||'09:00'}"></div><div class="slotRow"><label>Комментарий</label><input id="slotLabel${i}" placeholder="например, после еды"></div></div>`).join('')}
  let addScheduleInProgress=false;
  async function addSchedule(){
    if(!me?.can_manage_current_profile){toast('Нет доступа к управлению этим профилем');return}
    if(addScheduleInProgress){toast('Уже добавляю лекарство...');return}
    const f=parseFrequency();
    const entries=[];
    const seen=new Set();
    for(let i=0;i<f.count;i++){
      const time=document.getElementById('slotTime'+i).value;
      const label=document.getElementById('slotLabel'+i).value.trim();
      const key=`${time}|${label||time}`;
      if(time && !seen.has(key)){seen.add(key);entries.push({time_local:time,label:label||time})}
    }
    const payload={name:document.getElementById('name').value.trim(),dose:document.getElementById('dose').value.trim(),start_date:document.getElementById('startDate').value||null,end_date:document.getElementById('endDate').value||null,recurrence_type:f.recurrence_type,recurrence_interval_days:f.recurrence_interval_days,entries};
    if(!payload.name||!payload.dose||!entries.length){toast('Заполните лекарство, дозу и хотя бы одно время');return}
    addScheduleInProgress=true;
    try{
      const res=await api('/api/schedules',{method:'POST',body:JSON.stringify(payload)});
      toast(`Лекарство добавлено: ${res.count||entries.length} прием(а)`);
      ['name','dose','startDate','endDate'].forEach(id=>document.getElementById(id).value='');
      document.getElementById('frequency').value='daily:1:1';
      renderFrequencySlots();
      await loadSchedules();
      await loadToday();
    } finally { addScheduleInProgress=false; }
  }
  async function deleteSchedule(id){if(!confirm('Удалить этот прием из расписания?'))return;await api('/api/schedules/'+id,{method:'DELETE'});toast('Прием удален');loadSchedules();loadToday()}
  async function loadStats(){const rows=await api('/api/stats');const root=document.getElementById('stats');if(!rows.length){root.innerHTML='<div class="empty">Статистики пока нет</div>';return}root.innerHTML=`<div class="tableWrap"><table class="miniTable statsTable"><tr><th>Препарат</th><th>✅</th><th>⏭️</th><th>⏳</th><th>%</th></tr>${rows.map(r=>`<tr><td>${escapeHtml(r.medicine)}</td><td>${r.taken}</td><td>${r.skipped}</td><td>${r.pending}</td><td>${r.taken_percent}%</td></tr>`).join('')}</table></div>`}
  async function loadMedicines(){const select=document.getElementById('medicineSelect');const meds=await api('/api/medicines');select.innerHTML=meds.map(m=>`<option value="${m.id}">${escapeHtml(m.name)}</option>`).join('');if(meds.length)loadHistory();else document.getElementById('history').innerHTML='<div class="empty">Препаратов пока нет</div>'}
  async function loadHistory(){const id=document.getElementById('medicineSelect').value;const root=document.getElementById('history');if(!id){root.textContent='Выберите препарат';return}const rows=await api(`/api/medicines/${id}/history`);if(!rows.length){root.innerHTML='<div class="empty">Истории пока нет</div>';return}root.innerHTML=`<div class="tableWrap"><table class="miniTable historyTable"><tr><th>Дата</th><th>План</th><th>Статус</th></tr>${rows.map(r=>`<tr><td>${r.date}</td><td>${r.due_time}<br>${escapeHtml(r.dose)}</td><td>${r.status==='taken'?'✅ '+(r.taken_at||''):r.status==='skipped'?'⏭️ '+(r.skipped_at||''):'⏳'}</td></tr>`).join('')}</table></div>`}
  async function init(){try{renderFrequencySlots();me=await api('/api/me');await loadProfiles();me=await api('/api/me');document.getElementById('main').classList.remove('hidden');document.getElementById('bottomTabs').classList.remove('hidden');if(me.can_manage_current_profile)document.getElementById('tabAdmin').classList.remove('hidden');await loadToday();const h=location.hash.replace('#','');if(['stats','history','admin'].includes(h)){if(h==='admin'&&!me.can_manage_current_profile)showTab('today');else showTab(h)}}catch(e){const access=document.getElementById('access');access.className='card deny';access.textContent='Доступ закрыт. Откройте мини-приложение из Telegram и убедитесь, что ваш Telegram ID добавлен в CHILD_CHAT_ID или PARENT_CHAT_IDS.'}}
  init();
</script>
</body>
</html>
